syntax = "proto3";

package simplecloud.prefixes.v1;

option java_package = "app.simplecloud.prefixes.v1";
option java_multiple_files = true;

message ChatMessageEvent {
  string json = 1;
}

message TablistEntryUpdateEvent {
  string player_id = 1;
  string player_name = 2;
  string display_name = 3;
  int32 priority = 4;
  repeated TablistProfileProperty profile_properties = 5;
  int32 latency = 6;
  TablistGameMode game_mode = 7;
  optional bool show_hat = 8;
  int32 list_order = 9;
}

message TablistProfileProperty {
  string name = 1;
  string value = 2;
  optional string signature = 3;
}

enum TablistGameMode {
  TABLIST_GAME_MODE_UNSPECIFIED = 0;
  TABLIST_GAME_MODE_SURVIVAL = 1;
  TABLIST_GAME_MODE_CREATIVE = 2;
  TABLIST_GAME_MODE_ADVENTURE = 3;
  TABLIST_GAME_MODE_SPECTATOR = 4;
}

message TablistEntryRemoveEvent {
  string player_id = 1;
}

message TablistSyncRequest { }
